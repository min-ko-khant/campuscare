<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | CampusCare</title>

    <link rel="stylesheet" href="../../css/auth.css" />
</head>

<body>
    <main class="auth-page">
        <section class="otp-container">
            <div class="otp-card">
                <div class="otp-icon">🔑</div>

                <h1>Forgot Password?</h1>

                <p class="otp-subtitle">
                    Enter your registered email address.<br />
                    We'll send you a password reset link or token.
                </p>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                            required />
                    </div>

                    <div id="forgotMessage" class="form-message" role="alert" aria-live="polite"></div>

                    <button type="submit" id="forgotButton" class="otp-verify-button">
                        Send Reset Request
                    </button>
                </form>

                <a href="login.html" class="otp-back"> Back to Login </a>
            </div>
        </section>
    </main>

    <script src="../../js/auth/forgot-password.js"></script>
</body>

</html>
