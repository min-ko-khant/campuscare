<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CampusCare</title>

    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="otp-container">

            <div class="otp-card">

                <div class="otp-icon">
                    🔐
                </div>

                <h1>Reset Password</h1>

                <p class="otp-subtitle">
                    Create a new password for your account.
                </p>

                <form id="resetPasswordForm">

                    <div class="form-group">
                        <label for="password">
                            New Password
                        </label>

                        <div class="password-wrapper">

                            <input type="password" id="password" placeholder="Enter new password"
                                autocomplete="new-password" required>

                            <button type="button" id="togglePassword" class="password-toggle">
                                Show
                            </button>

                        </div>
                    </div>


                    <div class="form-group">
                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input type="password" id="confirmPassword" placeholder="Confirm new password"
                                autocomplete="new-password" required>

                            <button type="button" id="toggleConfirmPassword" class="password-toggle">
                                Show
                            </button>

                        </div>
                    </div>


                    <div id="resetMessage" class="form-message" role="alert" aria-live="polite"></div>


                    <button type="submit" id="resetButton" class="otp-verify-button">
                        Reset Password
                    </button>

                </form>


                <a href="login.html" class="otp-back">
                    Back to Login
                </a>

            </div>

        </section>

    </main>

    <script src="../../js/auth/reset-password.js"></script>

</body>

</html>
